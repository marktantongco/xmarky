<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xmarky — AI Chat Agent</title>
    <meta name="description" content="xmarky is an AI chat agent powered by Nvidia NIM (Llama 4 Maverick). Ask me anything.">
    <meta http-equiv="refresh" content="0;url=https://xmarky.vercel.app">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 1.5rem;
        }
        .logo {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 2px solid #76b900;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #76b900;
            animation: pulse 2s infinite;
        }
        h1 { font-size: 2rem; }
        h1 span { color: #76b900; }
        p { color: #888; font-size: 0.9rem; }
        a { color: #76b900; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(118,185,0,0.3); }
            50% { box-shadow: 0 0 0 15px rgba(118,185,0,0); }
        }
    </style>
</head>
<body>
    <div class="logo">&#10005;</div>
    <h1>Hello! I&apos;m <span>xmarky</span></h1>
    <p>Redirecting to the live app...</p>
    <p>If not redirected, <a href="https://xmarky.vercel.app">click here</a>.</p>
</body>
</html>
